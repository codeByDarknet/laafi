# Configuration du backend Laafi. Toutes les valeurs sensibles viennent de variables d'environnement ;
# les valeurs par défaut sont des valeurs de DÉMONSTRATION (à remplacer via .env / scripts/install.sh).
server:
  port: 8090
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: laafi-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:laafi}
    username: ${DB_USER:laafi}
    password: ${DB_PASSWORD:laafi-dev-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # {vendor} = postgresql en production : ajoute les déclencheurs « ajout seul » propres à PostgreSQL.
    locations: classpath:db/migration/commun,classpath:db/migration/{vendor}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

laafi:
  public-url: ${PUBLIC_URL:http://localhost:8888}
  matrix:
    server-name: ${SYNAPSE_SERVER_NAME:laafi.local}
  keycloak:
    url: ${KEYCLOAK_URL:http://keycloak:8080/auth}
    realm: ${KEYCLOAK_REALM:laafi}
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:laafi-backend}
    client-secret: ${KEYCLOAK_BACKEND_SECRET:backend-dev-secret}
    # Vide = ${PUBLIC_URL}/auth/realms/${KEYCLOAK_REALM}
    issuer: ${KEYCLOAK_ISSUER:}
  synapse:
    url: ${SYNAPSE_URL:http://synapse:8008}
    service-user: ${SYNAPSE_SERVICE_USER:laafi-service}
    service-password: ${SYNAPSE_SERVICE_PASSWORD:service-dev-password}
    idp-id: ${SYNAPSE_IDP_ID:oidc-keycloak}
    connexion-au-demarrage: true
    delai-reessai: 5s
    tentatives-max: 60
  journal:
    repertoire-cles: ${LAAFI_CLES_DIR:/var/lib/laafi/cles}
  securite:
    clients-autorises: ${LAAFI_CLIENTS_AUTORISES:laafi-console,laafi-client}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
