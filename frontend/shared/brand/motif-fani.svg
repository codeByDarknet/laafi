<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Motif inspiré du Faso Dan Fani (pagne tissé burkinabè).
       Chaîne : bandes verticales vert / encre / or / rouge.
       Trame : fils horizontaux clairs. Armure : petits damiers aux croisements. -->
  <rect width="48" height="48" fill="#1E2622"/>
  <rect x="0" width="14" height="48" fill="#009E49"/>
  <rect x="16" width="4" height="48" fill="#FCD116"/>
  <rect x="22" width="14" height="48" fill="#EF2B2D"/>
  <rect x="36" width="2" height="48" fill="#FCD116"/>
  <rect x="40" width="2" height="48" fill="#FCD116"/>
  <g fill="#FFFFFF" fill-opacity="0.22">
    <rect y="2" width="48" height="1"/><rect y="5" width="48" height="1"/>
    <rect y="8" width="48" height="1"/><rect y="11" width="48" height="1"/>
    <rect y="14" width="48" height="1"/><rect y="17" width="48" height="1"/>
    <rect y="20" width="48" height="1"/><rect y="23" width="48" height="1"/>
    <rect y="26" width="48" height="1"/><rect y="29" width="48" height="1"/>
    <rect y="32" width="48" height="1"/><rect y="35" width="48" height="1"/>
    <rect y="38" width="48" height="1"/><rect y="41" width="48" height="1"/>
    <rect y="44" width="48" height="1"/><rect y="47" width="48" height="1"/>
  </g>
  <g fill="#1E2622" fill-opacity="0.55">
    <rect x="4" y="22" width="6" height="4"/><rect x="26" y="22" width="6" height="4"/>
    <rect x="4" y="46" width="6" height="2"/><rect x="26" y="46" width="6" height="2"/>
    <rect x="4" y="0" width="6" height="2"/><rect x="26" y="0" width="6" height="2"/>
  </g>
</svg>
