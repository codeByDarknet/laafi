# En-têtes de sécurité des applications Angular (client et console).
# NB : nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un bloc en définit :
# ce fichier est donc inclus dans chaque location concernée.
#
# CSP stricte : uniquement nos propres ressources (pas de CDN, pas de police externe).
#  - 'wasm-unsafe-eval' : nécessaire pour compiler le module WebAssembly de la crypto Rust
#    de matrix-js-sdk (vodozemac) ; n'autorise PAS eval() JavaScript.
#  - style-src 'unsafe-inline' : Angular injecte les styles de composants dans des <style>.
#  - blob: pour les pièces jointes déchiffrées localement (images, audio) et les workers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
include /etc/nginx/laafi/entetes-communs.conf;
