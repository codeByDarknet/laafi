# En-têtes transmis aux services internes. X-Forwarded-Host contient déjà le port public
# (pas de X-Forwarded-Port : le port interne 80 de la passerelle fausserait les URL de Keycloak).
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $laafi_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
