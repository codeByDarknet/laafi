# =============================================================================
# Laafi — passerelle nginx : SEUL point d'entrée exposé (port 8888 sur l'hôte).
# Routage (cf. docs/CONTRAT-ARCHITECTURE.md §1) :
#   /                 → client   (Angular, messagerie)
#   /console/         → console  (Angular, administration)
#   /api/             → backend  (Spring Boot)
#   /_matrix/         → synapse  (API client Matrix ; fédération fermée)
#   /_synapse/client/ → synapse  (retour SSO OIDC, déconnexion back-channel)
#   /_synapse/admin/  → 403      (Admin API réservée au backend, réseau interne)
#   /auth/            → keycloak
# =============================================================================

# Journal d'accès MINIMISÉ : ni adresse IP, ni user-agent, ni chaîne de requête
# ($uri n'inclut pas « ?… » : les loginToken / codes OIDC n'y apparaissent jamais).
log_format laafi_minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

# Résolution DNS Docker à la demande : la passerelle démarre même si un service
# applicatif (backend, client, console) n'est pas encore lancé (réponse 502 en attendant).
resolver 127.0.0.11 valid=10s ipv6=off;

# Schéma d'origine : conservé si un frontal TLS placé devant la passerelle l'indique déjà.
map $http_x_forwarded_proto $laafi_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /dev/stdout laafi_minimal;
    error_log  /dev/stderr warn;

    # Pièces jointes chiffrées (doit rester ≥ max_upload_size de Synapse).
    client_max_body_size 100m;

    set $up_client   http://client:80;
    set $up_console  http://console:80;
    set $up_backend  http://backend:8090;
    set $up_synapse  http://synapse:8008;
    set $up_keycloak http://keycloak:8080;

    # Santé de la passerelle elle-même (utilisée par le healthcheck Docker).
    location = /passerelle-sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Matrix ------------------------------------------------------------
    # Admin API : jamais accessible depuis l'extérieur.
    location ^~ /_synapse/admin {
        include /etc/nginx/laafi/entetes-communs.conf;
        return 403;
    }
    location ^~ /_synapse/client/ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/entetes-communs.conf;
        proxy_pass $up_synapse;
    }
    location ^~ /_synapse/ {
        return 404;
    }
    # Fédération désactivée : on ne publie ni l'API fédération ni l'API de clés serveur.
    location ^~ /_matrix/federation/ { return 404; }
    location ^~ /_matrix/key/        { return 404; }
    location ^~ /_matrix/ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/entetes-communs.conf;
        add_header X-Frame-Options "DENY" always;
        proxy_read_timeout 120s;          # /sync en long-polling
        proxy_buffering off;
        proxy_request_buffering off;      # envoi des médias en flux
        proxy_pass $up_synapse;
    }

    # --- Keycloak ----------------------------------------------------------
    # Les consoles d'administration Keycloak (realm master, /auth/admin) ne sont pas publiées :
    # l'administration des agents passe par la console Laafi (backend → API Keycloak interne).
    location ^~ /auth/admin/          { return 403; }
    location ^~ /auth/realms/master/  { return 403; }
    location ^~ /auth/ {
        include /etc/nginx/laafi/proxy-communs.conf;
        # Keycloak fournit ses propres en-têtes (CSP, X-Frame-Options SAMEORIGIN requis
        # par les iframes de keycloak-js) : on ne les remplace pas ici.
        add_header Referrer-Policy "no-referrer" always;
        proxy_buffer_size 64k;            # en-têtes Set-Cookie volumineux de Keycloak
        proxy_buffers 8 64k;
        proxy_pass $up_keycloak;
    }

    # --- Backend Laafi -----------------------------------------------------
    location ^~ /api/ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/entetes-communs.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        proxy_pass $up_backend;
    }

    # --- Applications Angular ---------------------------------------------
    location = /console {
        return 301 /console/;
    }
    location /console/ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/securite-apps.conf;
        proxy_pass $up_console;
    }

    # Page de vérification silencieuse keycloak-js : chargée dans une iframe de MÊME origine,
    # elle ne peut donc pas porter X-Frame-Options DENY.
    location ~ ^/console/silent-check-sso\.html$ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/securite-iframe-sso.conf;
        proxy_pass $up_console;
    }
    location ~ ^/silent-check-sso\.html$ {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/securite-iframe-sso.conf;
        proxy_pass $up_client;
    }

    location / {
        include /etc/nginx/laafi/proxy-communs.conf;
        include /etc/nginx/laafi/securite-apps.conf;
        proxy_pass $up_client;
    }
}
