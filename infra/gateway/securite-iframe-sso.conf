# silent-check-sso.html (keycloak-js) : petite page qui transmet le résultat SSO à la page
# parente par postMessage ; encadrable uniquement par notre propre origine.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'" always;
include /etc/nginx/laafi/entetes-communs.conf;
