# En-têtes communs à toutes les réponses.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Micro autorisé pour nous-mêmes (messages vocaux) ; caméra, géolocalisation, etc. interdites.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
